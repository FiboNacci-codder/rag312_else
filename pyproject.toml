[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag312"
version = "0.1.0"
description = "RAG de procedimientos institucionales SIELSE — infraestructura compartida (config, clientes vLLM/Qdrant)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["rag312"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
